<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛집 소개</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf7f2;
    --ink: #2b2623;
    --sub: #7a706a;
    --accent: #c0713b;
    --line: #e6ded4;
    --card: #ffffff;
  }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- 메뉴바 ---------- */
  .menubar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .menubar .logo { font-weight: 700; font-size: 18px; text-decoration: none; }
  .menubar nav { display: flex; gap: 20px; }
  .menubar nav a { text-decoration: none; color: var(--sub); font-size: 15px; }
  .menubar nav a:hover { color: var(--accent); }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  .page-title { font-size: 40px; font-weight: 800; margin-bottom: 8px; }
  .page-desc { color: var(--sub); margin-bottom: 32px; }

  /* ---------- 표지 ---------- */
  .cover {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 20px;
  }
  .cover h1 { font-size: clamp(32px, 6vw, 56px); margin-bottom: 8px; }
  .cover p { color: var(--sub); margin-bottom: 40px; }
  .cover-buttons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .cover-btn {
    flex: 1 1 180px; max-width: 240px;
    padding: 36px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    font-size: 22px; font-weight: 700;
    transition: transform .15s, box-shadow .15s;
  }
  .cover-btn:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }

  /* ---------- 디저트 소개란: PC 3+2 / 모바일 세로 ---------- */
  .cards { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  .card {
    width: calc((100% - 40px) / 3);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    text-align: left;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
  .card .thumb {
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, #efe3d3, #e2cdb4);
    display: flex; align-items: center; justify-content: center;
    color: var(--sub); font-size: 14px;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .label { padding: 16px 18px; font-size: 20px; font-weight: 700; }

  /* ---------- 가게 상세 ---------- */
  .store-name { font-size: clamp(36px, 7vw, 64px); font-weight: 800; margin-bottom: 28px; }
  .store-body { display: flex; gap: 32px; align-items: flex-start; }
  .photo-box { flex: 0 0 55%; }
  .photo {
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, #efe3d3, #e2cdb4);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    color: var(--sub); overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .credit { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .info { flex: 1; min-width: 0; }
  .info section { margin-bottom: 28px; }
  .info h3 { font-size: 15px; color: var(--accent); margin-bottom: 8px; letter-spacing: .02em; }
  .info p { font-size: 17px; }
  .map-link {
    display: inline-block; margin-top: 4px;
    padding: 8px 16px;
    background: #03c75a; color: #fff;
    border-radius: 8px; text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .menu-list { list-style: none; }
  .menu-list li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 17px;
  }
  .menu-list li span:last-child { font-weight: 700; white-space: nowrap; }

  .back-btn {
    margin-top: 40px; padding: 10px 20px;
    background: #fff; border: 1px solid var(--line); border-radius: 999px; font-size: 15px;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .coming { text-align: center; padding: 80px 0; color: var(--sub); }

  /* ---------- 반응형 ---------- */
  @media (max-width: 900px) {
    .card { width: calc((100% - 20px) / 2); }
  }
  @media (max-width: 700px) {
    .menubar { padding: 12px 16px; }
    .menubar nav { gap: 14px; }
    .card { width: 100%; }
    .store-body { flex-direction: column; gap: 24px; }
    .photo-box { flex: none; width: 100%; }
    .page-title { font-size: 30px; }
  }
</style>
</head>
<body>

<div id="menubar-slot"></div>
<div id="app"></div>

<script>
  // ============================================================
  // ★ 여기만 고치면 내용이 바뀝니다 ★
  // image: 사진 파일 경로 또는 주소 (예: "images/starbucks.jpg"), 비워 두면 빈 칸 표시
  // credit: 사진 출처 (예: "사진: 작가명 / Unsplash")
  // ============================================================
  const STORES = {
    bagel: {
      name: "베이글",
      image: "", credit: "",
      mapUrl: "#",
      hours: "내용 미정",
      menu: [["추천 메뉴 1", "0,000원"], ["추천 메뉴 2", "0,000원"], ["추천 메뉴 3", "0,000원"]]
    },
    starbucks: {
      name: "스타벅스",
      image: "", credit: "",
      mapUrl: "#",
      hours: "내용 미정",
      menu: [["추천 메뉴 1", "0,000원"], ["추천 메뉴 2", "0,000원"], ["추천 메뉴 3", "0,000원"]]
    },
    twosome: {
      name: "투썸",
      image: "", credit: "",
      mapUrl: "#",
      hours: "내용 미정",
      menu: [["추천 메뉴 1", "0,000원"], ["추천 메뉴 2", "0,000원"], ["추천 메뉴 3", "0,000원"]]
    },
    russian: {
      name: "러시안 케이크",
      image: "", credit: "",
      mapUrl: "#",
      hours: "내용 미정",
      menu: [["추천 메뉴 1", "0,000원"], ["추천 메뉴 2", "0,000원"], ["추천 메뉴 3", "0,000원"]]
    },
    uji: {
      name: "우지 커피",
      image: "", credit: "",
      mapUrl: "#",
      hours: "내용 미정",
      menu: [["추천 메뉴 1", "0,000원"], ["추천 메뉴 2", "0,000원"], ["추천 메뉴 3", "0,000원"]]
    }
  };

  // 한식·양식: 번호(1~5)만 붙인 칸 5개씩 (k1~k5, w1~w5). 가게가 정해지면 name을 가게 이름으로 바꾸면 됩니다.
  const blankStore = (name) => ({
    name: name, image: "", credit: "", mapUrl: "#",
    hours: "내용 미정",
    menu: [["추천 메뉴 1", "0,000원"], ["추천 메뉴 2", "0,000원"], ["추천 메뉴 3", "0,000원"]]
  });
  for (let i = 1; i <= 5; i++) {
    STORES["k" + i] = blankStore(String(i));
    STORES["w" + i] = blankStore(String(i));
  }

  // 분류별로 어떤 가게 칸이 들어가는지
  const CATEGORIES = {
    korean:  { title: "한식",   ids: ["k1", "k2", "k3", "k4", "k5"] },
    western: { title: "양식",   ids: ["w1", "w2", "w3", "w4", "w5"] },
    dessert: { title: "디저트", ids: ["bagel", "starbucks", "twosome", "russian", "uji"] }
  };

  // ---------- 화면 그리기 ----------
  const app = document.getElementById("app");
  const menubarSlot = document.getElementById("menubar-slot");

  function menubar() {
    return `
      <header class="menubar">
        <a class="logo" href="#/">맛집 소개</a>
        <nav>
          <a href="#/korean">한식</a>
          <a href="#/western">양식</a>
          <a href="#/dessert">디저트</a>
        </nav>
      </header>`;
  }

  function imgOrEmpty(src, alt, emptyText) {
    return src ? `<img src="${src}" alt="${alt}">` : emptyText;
  }

  function viewCover() {
    menubarSlot.innerHTML = "";
    app.innerHTML = `
      <div class="cover">
        <h1>맛집 소개</h1>
        <p>보고 싶은 분류를 선택해 주세요</p>
        <div class="cover-buttons">
          <button class="cover-btn" onclick="location.hash='#/korean'">한식</button>
          <button class="cover-btn" onclick="location.hash='#/western'">양식</button>
          <button class="cover-btn" onclick="location.hash='#/dessert'">디저트</button>
        </div>
      </div>`;
  }

  function viewCategory(key) {
    menubarSlot.innerHTML = menubar();
    const cat = CATEGORIES[key];
    const cards = cat.ids.map(id => {
      const s = STORES[id];
      return `
      <button class="card" onclick="location.hash='#/store/${id}'">
        <div class="thumb">${imgOrEmpty(s.image, s.name, "사진 자리")}</div>
        ${s.name ? `<div class="label">${s.name}</div>` : ""}
      </button>`;
    }).join("");
    app.innerHTML = `
      <main>
        <h2 class="page-title">${cat.title}</h2>
        <p class="page-desc">칸을 선택하면 자세한 소개를 볼 수 있어요.</p>
        <div class="cards">${cards}</div>
        <button class="back-btn" onclick="location.hash='#/'">← 표지로</button>
      </main>`;
  }


  function viewStore(id) {
    const s = STORES[id];
    if (!s) { location.hash = "#/"; return; }
    const catKey = Object.keys(CATEGORIES).find(k => CATEGORIES[k].ids.includes(id)) || "dessert";
    menubarSlot.innerHTML = menubar();
    const menuItems = s.menu.map(([n, p]) => `<li><span>${n}</span><span>${p}</span></li>`).join("");
    app.innerHTML = `
      <main>
        <h2 class="store-name">${s.name || "가게 이름"}</h2>
        <div class="store-body">
          <div class="photo-box">
            <div class="photo">${imgOrEmpty(s.image, s.name, "사진 자리")}</div>
            <p class="credit">${s.credit || "사진 출처: (추가 예정)"}</p>
          </div>
          <div class="info">
            <section>
              <h3>위치</h3>
              <a class="map-link" href="${s.mapUrl}" target="_blank" rel="noopener">네이버지도에서 보기</a>
            </section>
            <section>
              <h3>영업시간</h3>
              <p>${s.hours}</p>
            </section>
            <section>
              <h3>추천 메뉴 및 가격</h3>
              <ul class="menu-list">${menuItems}</ul>
            </section>
          </div>
        </div>
        <button class="back-btn" onclick="location.hash='#/${catKey}'">← ${CATEGORIES[catKey].title} 목록으로</button>
      </main>`;
  }

  // ---------- 주소(#) 기준으로 화면 전환 ----------
  function route() {
    const hash = location.hash || "#/";
    const parts = hash.replace(/^#\//, "").split("/");
    if (parts[0] === "store") viewStore(parts[1]);
    else if (CATEGORIES[parts[0]]) viewCategory(parts[0]);
    else viewCover();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
